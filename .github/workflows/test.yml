name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install dependencies
        run: |
          poetry install --only main --no-root --no-interaction
          poetry run python -m pip install httpx

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Run unit tests
        run: poetry run python -m unittest discover -s tests -v

      # Exercise the API with a real PostgreSQL connection as well.
      - name: Test API and database connection
        run: |
          poetry run python - <<'PY'
          import unittest
          from unittest.mock import AsyncMock, patch

          from fastapi.testclient import TestClient

          from app.app_config import config
          from app.startup import postgres_client
          from main import app


          class ApiTests(unittest.TestCase):
              def test_health_with_database(self):
                  with TestClient(app) as client:
                      response = client.get("/health")
                  self.assertEqual(response.status_code, 200)
                  self.assertEqual(response.json(), {
                      "status": "ok",
                      "app": config.APP_NAME,
                      "environment": "test",
                      "database": "ok",
                  })

              def test_health_with_unavailable_database(self):
                  with TestClient(app) as client:
                      with patch.object(
                          postgres_client,
                          "ping",
                          new_callable=AsyncMock,
                          side_effect=ConnectionError("Database unavailable"),
                      ):
                          response = client.get("/health")
                  self.assertEqual(response.status_code, 503)
                  self.assertEqual(response.json()["status"], "degraded")
                  self.assertEqual(response.json()["database"], "unavailable")

              def test_openapi(self):
                  with TestClient(app) as client:
                      response = client.get("/openapi.json")
                  self.assertEqual(response.status_code, 200)
                  self.assertIn("/health", response.json()["paths"])


          unittest.main(verbosity=2)
          PY
